# Runs the test suite and the end-to-end simulation on Windows, the platform
# the agent runs on, for every push and pull request to main. Neither needs
# Outlook, a network share, Power Automate or customer data.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the version the agent runs on (product owner).
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app dashboard tests sim
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Run the simulation
        # The real agent against a fake Outlook and fake flows; exits 1 if a scenario fails.
        run: python -m sim.run
